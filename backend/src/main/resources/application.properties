# ===================================================================
# Smart Attendance System - Application Configuration
# ===================================================================

# Server
server.port=8085
server.servlet.context-path=/api/v1

# ===================================================================
# Database Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:smart_attendance_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET:SmartAttendanceSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2026SecureKey}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# ===================================================================
# File Upload Configuration
# ===================================================================
app.file.upload-dir=uploads/profile-images
app.file.max-size=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Mail Configuration
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@smartattendance.com}

# ===================================================================
# OTP Configuration
# ===================================================================
app.otp.expiration-minutes=10
app.otp.length=6

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8085

# ===================================================================
# Swagger / OpenAPI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===================================================================
# Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.mentormatrix=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/smart-attendance.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ===================================================================
# Admin Configuration
# ===================================================================
app.admin.max-count=5
